<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <h1>💸 Expense Tracker</h1>

    <form id="expense-form">
      <input id="title" placeholder="What did you spend on?" required maxlength="100" />
      <input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required />
      <select id="category">
        <option>Food</option><option>Transport</option><option>Shopping</option>
        <option>Bills</option><option>Fun</option><option>Other</option>
      </select>
      <input id="spent_on" type="date" />
      <button type="submit">Add</button>
    </form>

    <section class="summary">
      <h2>Total: ₹<span id="total">0.00</span></h2>
      <div id="categories"></div>
    </section>

    <ul id="list"></ul>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
